services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgermate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledgermate"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ledgermate?schema=public
    ports: ["4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports: ["3000:3000"]
    depends_on: [api]
  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "dev", "-w", "@ledgermate/worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ledgermate?schema=public
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
