name: LedgerMate CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledgermate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgermate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/ledgermate?schema=public
      JWT_SECRET: ledger-mate-ci-secret-at-least-32-characters
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api
      WEB_URL: http://localhost:3000
      PORT: 4000
      RATE_LIMIT_MAX: 2000
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema packages/database/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:inventory
      - run: npm run test:api
      - run: npm run test:ui
      - run: npm run test:cucumber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            automation/reports/playwright-html/
            automation/reports/allure-results/
            automation/reports/test-results/
          retention-days: 14
